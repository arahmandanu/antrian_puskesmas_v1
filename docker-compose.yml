version: "3.9"

services:
   db:
    image: mysql:8.0
    container_name: my_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""           # empty root password (insecure)
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # allow empty password (required)
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: ""                # empty password for the created user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
